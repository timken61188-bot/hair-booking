name: 部署後端（Supabase）

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 連結專案
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: 建立／更新資料表
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: 寫入密碼
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
          ADMIN_LINE_USER_ID: ${{ vars.ADMIN_LINE_USER_ID }}
          LIFF_ID: ${{ vars.LIFF_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            LINE_CHANNEL_ACCESS_TOKEN="$LINE_CHANNEL_ACCESS_TOKEN" \
            LINE_LOGIN_CHANNEL_ID="$LINE_LOGIN_CHANNEL_ID" \
            ADMIN_LINE_USER_ID="${ADMIN_LINE_USER_ID:-none}" \
            LIFF_URL="https://liff.line.me/$LIFF_ID" \
            CRON_SECRET="$CRON_SECRET"

      - name: 部署 Functions
        run: |
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy reminders --project-ref "$PROJECT_REF" --no-verify-jwt
